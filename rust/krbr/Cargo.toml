[package]
name = "krbr"
description = "KRB Renderer (Rust): KiCad 連携 物理ベース レンダラー"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krbr"
path = "src/main.rs"

# エクスプローラーから開く用（コンソールを出さずに krbr.exe のビューアを起動する）
[[bin]]
name = "KRB-Renderer"
path = "src/launcher.rs"

[dependencies]
krbr-core = { path = "../crates/krbr-core" }
krbr-kicad = { path = "../crates/krbr-kicad" }
krbr-model = { path = "../crates/krbr-model" }
krbr-geom = { path = "../crates/krbr-geom" }
krbr-scene = { path = "../crates/krbr-scene" }
krbr-render = { path = "../crates/krbr-render" }
krbr-app = { path = "../crates/krbr-app" }
glam.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
clap.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
