[workspace]
resolver = "2"
members = ["crates/krbr-core", "crates/krbr-pbr", "crates/krbr-kicad", "crates/krbr-model", "crates/krbr-geom", "crates/krbr-scene", "crates/krbr-render", "crates/krbr-capi", "crates/krbr-app", "krbr"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1

# はんだのシミュレーション（krbr-scene の solder_sim）は最適化しないと桁違いに遅い（cargo test でも数秒で終わるように）
[profile.dev.package.krbr-scene]
opt-level = 3
