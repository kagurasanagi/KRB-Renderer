# cargo-about の設定（scripts\make_dist.ps1 が licenses\Rust-crates-LICENSES.txt を作るのに使う）。
# krbr.exe に入る Windows 向けの通常の依存だけを数える。依存のライセンスが増えたらここに足す
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
