<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>/*STYLE*/</style>
</head>
<body class="toolbar">
  <nav class="menubar" id="menubar"></nav>
  <div class="tools">
  <div class="cluster"><div class="title"></div><div class="group">
    <button class="tool" id="pause">
      <svg id="pause-icon" viewBox="0 0 24 24"></svg>
      <span id="pause-label"></span>
    </button>
  </div></div>
  <div class="sep"></div>
  <div class="cluster"><div class="title" id="group-camera"></div><div class="group">
    <button class="tool" id="top">
      <svg viewBox="0 0 24 24"><path d="M12 2.5v8"/><path d="M8.5 7.5 12 11l3.5-3.5"/><rect x="3" y="17.5" width="18" height="3" rx="1"/><path d="M6 17.5v-2.5h4v2.5M13 17.5v-3.5h5v3.5"/></svg>
      <span id="top-label"></span>
    </button>
    <button class="tool" id="bottom">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="3" rx="1"/><path d="M6 7V4.5h4V7M13 7V3.5h5V7"/><path d="M12 21.5v-8"/><path d="M8.5 16.5 12 13l3.5 3.5"/></svg>
      <span id="bottom-label"></span>
    </button>
    <button class="tool" id="fit">
      <svg viewBox="0 0 24 24"><path d="M3 8V4.5A1.5 1.5 0 0 1 4.5 3H8M16 3h3.5A1.5 1.5 0 0 1 21 4.5V8M21 16v3.5a1.5 1.5 0 0 1-1.5 1.5H16M8 21H4.5A1.5 1.5 0 0 1 3 19.5V16"/><rect x="7" y="8.5" width="10" height="7" rx="1.2"/><path d="M9.5 11h2.5v2.5"/></svg>
      <span id="fit-label"></span>
    </button>
  </div></div>
  <div class="sep"></div>
  <div class="cluster"><div class="title" id="group-visibility"></div><div class="group">
    <button class="tool" id="smd">
      <svg viewBox="0 0 24 24"><path d="M2.5 18.5h19"/><rect x="6" y="11" width="12" height="7.5" rx="1"/><path d="M8.5 11v7.5M15.5 11v7.5"/></svg>
      <span id="smd-label"></span>
    </button>
    <button class="tool" id="tht">
      <svg viewBox="0 0 24 24"><path d="M2.5 15h19"/><rect x="6.5" y="3" width="11" height="7" rx="2.5"/><path d="M9.5 10v11M14.5 10v11"/></svg>
      <span id="tht-label"></span>
    </button>
  </div></div>
  <div class="sep"></div>
  <div class="cluster"><div class="title" id="group-effects"></div><div class="group">
    <button class="tool" id="denoise">
      <svg viewBox="0 0 24 24"><path d="M14 4.5c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6z"/><path d="M19.5 2v3M18 3.5h3"/><circle cx="4" cy="5" r=".6"/><circle cx="6.5" cy="9" r=".6"/><circle cx="3.5" cy="13" r=".6"/><circle cx="6" cy="17.5" r=".6"/><circle cx="4" cy="21" r=".6"/></svg>
      <span id="denoise-label"></span>
    </button>
  </div></div>
  </div>
<script>
const ICONS = {
  pause: '<rect x="6.5" y="4.5" width="3.5" height="15" rx="1"/><rect x="14" y="4.5" width="3.5" height="15" rx="1"/>',
  resume: '<path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16.2 9.5"/>',
};
const post = (m) => window.ipc.postMessage(JSON.stringify(m));
for (const id of ["pause", "top", "bottom", "fit", "smd", "tht", "denoise"]) {
  document.getElementById(id).addEventListener("click", () => post({ type: "click", id }));
}
// キーはビューアに渡す（このページにフォーカスがあっても P・S・F などが効くように）
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  post({ type: "key", code: e.code });
  e.preventDefault();
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

// メニューの見出し：押すと Rust がその下にプルダウンを出す。開いている間は、載せただけで隣のメニューに替える
let openMenu = null;
function openAt(b) {
  const r = b.getBoundingClientRect();
  post({ type: "menu", id: b.dataset.id, x: r.left, y: r.bottom + 2 });
}
function setMenus(heads, open) {
  const bar = document.getElementById("menubar");
  if (bar.children.length !== heads.length) {
    bar.replaceChildren(...heads.map((h) => {
      const b = document.createElement("button");
      b.className = "menu-head";
      b.dataset.id = h.id;
      b.addEventListener("click", () => openAt(b));
      b.addEventListener("mouseenter", () => {
        if (openMenu && openMenu !== h.id) openAt(b);
      });
      return b;
    }));
  }
  heads.forEach((h, i) => {
    const b = bar.children[i];
    b.textContent = h.label;
    b.classList.toggle("open", open === h.id);
  });
  openMenu = open;
}

function setTool(id, { label, tip, on = false, crossed = false, enabled = true }) {
  const b = document.getElementById(id);
  document.getElementById(id + "-label").textContent = label;
  b.title = tip || "";
  b.classList.toggle("on", on);
  b.classList.toggle("crossed", crossed);
  b.disabled = !enabled;
}

// Rust から呼ぶ：今の状態（文字は Rust 側で訳したもの）
window.krbr = {
  toolbar(s) {
    const mode = s.done ? "done" : s.paused ? "resume" : "pause";
    document.getElementById("pause-icon").innerHTML = ICONS[mode];
    setTool("pause", { label: s.text[mode], tip: s.tips[mode === "done" ? "done" : "pause"], on: s.paused && !s.done, enabled: !s.done });
    setTool("top", { label: s.text.top, tip: s.tips.top, enabled: s.board });
    setTool("bottom", { label: s.text.bottom, tip: s.tips.bottom, enabled: s.board });
    setTool("fit", { label: s.text.fit, tip: s.tips.fit, enabled: s.board });
    setTool("smd", { label: s.text.smd, tip: s.tips.smd, on: s.smd, crossed: !s.smd, enabled: s.board });
    setTool("tht", { label: s.text.tht, tip: s.tips.tht, on: s.tht, crossed: !s.tht, enabled: s.board });
    setTool("denoise", { label: s.text.denoise, tip: s.tips.denoise, on: s.denoise });
    setMenus(s.menus, s.menuOpen);
    for (const [k, t] of Object.entries(s.groups)) document.getElementById("group-" + k).textContent = t;
  },
};
post({ type: "ready" });
</script>
</body>
</html>
