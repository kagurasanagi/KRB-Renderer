[package]
name = "krbr-app"
description = "KRB-Renderer: コマンドの実装（シーンの準備、render、ビューア）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krbr-core = { path = "../krbr-core" }
krbr-kicad = { path = "../krbr-kicad" }
krbr-model = { path = "../krbr-model" }
krbr-geom = { path = "../krbr-geom" }
krbr-scene = { path = "../krbr-scene" }
krbr-render = { path = "../krbr-render" }
glam.workspace = true
anyhow.workspace = true
toml = "0.8"
rfd = "0.15"
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
ash-window = "0.13"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36", default-features = false }
egui-ash-renderer = { version = "0.13", features = ["gpu-allocator"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
sys-locale = "0.3"
unic-langid = "0.9"
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# ビューアのボタン列・ステータスバーを WebView（WebView2）で描く試作（--web-ui）。Tauri の中の WebView の部品だけを使う
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

# 動画の書き出し（Media Foundation の H.264 エンコーダー）。版は wry が使うものと同じ
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }
