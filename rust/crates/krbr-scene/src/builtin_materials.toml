# krbr 組み込みの材質（OpenPBR Surface）。色はリニア
# 全体設定の materials/*.toml に同じ名前を書くと、書いた項目だけ上書きされる
# roughness_variation（粗さのむら）は 0.1〜0.8 mm 周期の模様。引きの画では画素と同じくらいの細かさになり
# 砂粒のようなノイズに見えるので、部品ではごく弱くしている（部品の質感は specular_roughness で表す）
# [krbr] conductor は測定値の複素屈折率の金属（krbr-scene の conductor.rs。出典は scripts/gen_conductors.py）。
# 屈折率は、分散式があるものは Sellmeier の係数（λ は µm、C は µm²。refractiveindex.info の値）、無いものは
# nd（587.6 nm）の代表値。表示名は krbr-app の i18n（material-<名前>）
# 材質はどれも自分の色を持つ。3D モデルの面の色は、組み込みの規則（krbr-scene の model_map.rs。model_color）が
# 部位の色の調整（材質名の +color=）として付ける

# ---------------------------------------------------------------- 金属（測定値）

